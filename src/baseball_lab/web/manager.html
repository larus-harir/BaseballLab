<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감독 모드 · Baseball Lab</title>
<style>
__APP_STYLES__
body:has(.page-manager){margin:0;border:0;background:#0b1219}
.page-manager{
 --ink:#eef5fa;--muted:#aebecb;--line:#334957;--surface:#16232e;--soft:#1d3240;
 --green:#75e0af;--paper:#0b1219;background:var(--paper);color:var(--ink);color-scheme:dark;
}
main.page-manager.app-page{max-width:1330px;padding-bottom:44px}
.page-manager.app-page>header{min-height:68px;border-color:var(--line);gap:12px}
.page-manager .brand{font-size:18px}.page-manager .brand::before{border-color:var(--green)}
.page-manager header a{color:var(--ink)}
.page-manager h1,.page-manager h2,.page-manager h3,.page-manager p{margin:0}
.page-manager h1,.club-title{font-size:clamp(28px,5vw,47px);line-height:1.18;letter-spacing:-.05em}
.page-manager h2{font-size:22px}.page-manager h3{font-size:17px}
.page-manager button,.page-manager .primary-link{background:var(--green);color:#0c241a;border:1px solid transparent;font-weight:750;border-radius:8px;padding:10px 16px}
.page-manager button.secondary,.page-manager button[role=tab]{background:var(--soft);color:var(--ink);border-color:var(--line)}
.page-manager button:disabled{opacity:.42;cursor:not-allowed}
.page-manager :is(input,select){background:#0d1922;color:var(--ink);border-color:#537180;border-radius:8px}
.page-manager :is(button,a,summary,input,select,[tabindex]):focus-visible{outline:3px solid #ffd578;outline-offset:3px}
.page-manager a{color:var(--green)}
.page-manager section,.page-manager article{margin:0;border:0;padding:0;background:none}
.game-shell{padding:22px 0;display:grid;gap:20px;min-width:0}
.club-banner{display:flex;justify-content:space-between;align-items:end;gap:14px;border:1px solid var(--line);padding:22px;border-radius:16px;
 background:linear-gradient(112deg,#173532,#132432 60%,#1b2e3d)}
.club-banner p{color:#c1d7d8;font-size:13px;margin-bottom:6px}
.club-banner strong{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.game-panel{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;min-width:0}
.panel-title{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.panel-title small,.quiet{color:var(--muted);font-size:13px}.panel-title h2{margin:0}
.club-form-layout,.draft-layout,.season-layout,.lineup-layout,.record-layout{display:grid;gap:16px;min-width:0}
.club-form-layout,.season-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.draft-layout{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);align-items:start}
.lineup-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.page-manager fieldset{margin:10px 0;padding:0;border:0;min-width:0}
.team-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.team-grid label{margin:0;position:relative}
.team-grid input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.team-grid span{display:grid;place-items:center;min-height:48px;background:#0d1922;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink);text-align:center;line-height:1.3}
.team-grid input:checked+span{border-color:var(--green);background:#183e36;color:#bdffd9}
.team-grid input:focus-visible+span{outline:3px solid #ffd578;outline-offset:3px}
.resume-card{display:grid;gap:12px;align-content:start}.resume-card .primary-link{justify-self:start;text-decoration:none}
.player-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.page-manager .player-card{display:grid;justify-content:stretch;align-items:start;gap:10px;text-align:left;padding:13px;background:#0f1a24;color:var(--ink);border:1px solid #364d5d;width:100%;min-width:0}
.page-manager .player-card[aria-pressed=true]{border-color:var(--green);background:#19352f;box-shadow:inset 0 0 0 1px var(--green)}
.player-card .player-role{color:var(--muted);font-size:12px}.player-name{display:block;color:var(--ink);font-size:clamp(16px,2.2vw,23px);letter-spacing:-.04em;overflow-wrap:anywhere}
.grade-list{display:grid;gap:5px;margin:0}.grade-trait{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:13px;color:#d7e1e9}
.grade{display:inline-grid;place-items:center;min-width:25px;min-height:24px;border-radius:5px;font-weight:850;font-variant-numeric:tabular-nums;background:#2c3945;color:#f0f5fb}
.grade-s{background:#ffd27e;color:#2a1900}.grade-a{background:#70e4aa;color:#09271a}.grade-b{background:#92cef9;color:#092339}.grade-c{background:#394e60}.grade-d{background:#433b49}
.pick-desk{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pick-desk label{flex:1;min-width:145px;margin:0}.pick-desk select{margin:4px 0 0}.pick-desk p{width:100%}
.field-board{position:relative;isolation:isolate;display:grid;gap:5px 7px;grid-template-columns:repeat(6,minmax(0,1fr));padding:12px 8px;border-radius:12px;background:#102b2a}
.field-board:before{content:'';position:absolute;inset:23% 26% 13%;border:1px solid #63a18d;border-radius:12%;transform:rotate(45deg);opacity:.45;z-index:-1}
.field-card{grid-column-end:span 2;display:grid;text-align:center;border-radius:7px;padding:4px 2px;background:#142822;color:#abbebc;font-size:11px;min-width:0}
.field-card b{color:#eff8f4;font-size:12px;white-space:nowrap}.field-card.current{outline:1px solid var(--green);color:var(--green)}
.field-card[data-pos=중견수]{grid-area:1/3/span 1/span 2}
.field-card[data-pos=좌익수]{grid-area:2/1/span 1/span 2}.field-card[data-pos=우익수]{grid-area:2/5/span 1/span 2}
.field-card[data-pos=유격수]{grid-area:3/2/span 1/span 2}.field-card[data-pos="2루수"]{grid-area:3/4/span 1/span 2}
.field-card[data-pos="3루수"]{grid-area:4/1/span 1/span 2}.field-card[data-pos="1루수"]{grid-area:4/5/span 1/span 2}
.field-card[data-pos=포수]{grid-area:5/3/span 1/span 2}.field-card[data-pos=지명타자]{grid-area:5/5/span 1/span 2}
.arm-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:10px 0 0}
.arm-board li{background:var(--soft);border-radius:7px;padding:5px 7px;font-size:11px;color:var(--muted)}.arm-board b{display:block;color:var(--ink);font-size:12px}
.manager-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.manager-summary>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.manager-summary strong{display:block;font-size:clamp(16px,3vw,26px);font-variant-numeric:tabular-nums}.manager-summary span{color:var(--muted);font-size:12px}
.manager-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.page-manager button[aria-selected=true]{background:var(--green);color:#0d241b;border-color:var(--green)}
.game-tab{min-width:0}.game-tab>div+div{margin-top:12px}
.order-list{display:grid;gap:7px;padding:0;margin:0;list-style:none}
.order-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;background:#101d27;border-radius:8px;padding:8px 10px}
.order-item small{color:var(--muted)}.order-item strong{display:block}.order-buttons{display:flex;gap:4px}.order-buttons button{padding:4px 8px;min-width:34px;min-height:36px}
.roster-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 0}.roster-card{background:#10202b;padding:10px;border-radius:8px;min-width:0}
.roster-card h3{font-size:15px;margin-bottom:6px}.roster-card select{font-size:13px;margin-top:8px}
.manager-table{overflow-x:auto}.manager-table table{width:100%;margin:0;border-collapse:collapse;font-variant-numeric:tabular-nums}
.manager-table td,.manager-table th{background:transparent;border-color:var(--line);color:var(--ink);text-align:left;white-space:nowrap;padding:8px 6px;font-size:13px}
.manager-table th{color:var(--muted)}.manager-table tr.mine{background:#1b3b31;font-weight:800}
.result-strip{display:flex;gap:6px;list-style:none;margin:12px 0 16px;padding:0}.result-strip li{padding:4px 8px;background:var(--soft);border-radius:5px;font-size:13px}
.result-strip .won{background:#214d3b;color:#b5ffce}.result-strip .lost{background:#492a31;color:#ffccd1}
.event-score{font-size:19px;font-weight:750;margin:8px 0!important}.event-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.game-help{font-size:13px;color:var(--muted)}.game-help summary{color:var(--ink)}.new-season-link{font-size:13px}
#manager-status:not(:empty),#manager-error:not(:empty){padding:10px 14px;background:var(--soft);border-radius:8px;margin-top:10px}
#manager-error{color:#ffc3ca}#manager-screen [hidden]{display:none!important}
@media(max-width:900px){.draft-layout,.season-layout,.club-form-layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:620px){
 .page-manager .club-banner{padding:14px}.game-shell{gap:14px}.game-panel{padding:12px}
 .player-grid{gap:5px}.page-manager .player-card{padding:8px 5px;gap:7px}.grade-trait{font-size:11px}.grade{min-width:19px;min-height:21px}
 .lineup-layout{grid-template-columns:minmax(0,1fr)}.manager-summary>div{padding:8px}.manager-summary{gap:5px}.team-grid{gap:6px}
 .page-manager .manager-tabs button{padding:8px 10px}.club-banner strong{font-size:13px}
}
</style>
</head>
<body>
<a class="skip-link" href="#manager-screen">본문으로 건너뛰기</a>
<main id="manager-screen" class="app-page page-manager">
  <header><a class="brand" href="/" aria-label="Baseball Lab 홈">Baseball Lab</a><span class="quiet">감독 모드</span></header>
  <p id="manager-status" role="status"></p><p id="manager-error" role="alert" tabindex="-1"></p>
  <div id="club-setup" class="game-shell" hidden>
    <div class="club-banner"><div><p id="format"></p><h1>시즌 시작</h1></div></div>
    <div class="club-form-layout">
      <form id="club-form" class="game-panel">
        <label>구단 이름<input id="club-name" maxlength="18" value="나의 구단" required></label>
        <fieldset><legend>대신할 팀</legend><div id="replace-team" class="team-grid"></div></fieldset>
        <button type="submit">선수 선발 시작</button>
      </form>
      <div class="game-panel resume-card" id="resume-box" hidden><h2>저장한 시즌</h2><a id="resume-save" class="primary-link">이어하기</a></div>
    </div>
  </div>
  <div id="season" class="game-shell" hidden></div>
  <details class="game-help"><summary>등급과 자료</summary>
    <p>등급은 2026 KBO 같은 역할 선수와 비교한 가상 능력입니다. S가 가장 높고 D가 가장 낮습니다. 집중 훈련 효과가 같은 등급 안에서 반영될 수 있습니다.</p>
    <p>선수 이름과 수비 포지션은 가상입니다. 진루는 기존 KBO 관측 전이를 사용합니다.</p>
    <p>2026 정규시즌 집계 · kaggle-netsong-kbo (게시자 CC BY-NC-SA 4.0).</p>
  </details>
</main>
<script>
'use strict';
const token='__SESSION_TOKEN__';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root='/api/manager';
const query=new URLSearchParams(location.search);
const tabs=[['overview','시즌'],['lineup','라인업'],['stats','선수 기록'],['games','경기 기록']];
let current=null,busy=false,activeTab='overview',marketSlot='',selectedCandidate=0;

async function api(url,body){
 const request=body?{method:'POST',headers:{'X-Lab-Token':token,'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
 const response=await fetch(url,request),data=await response.json();
 if(!response.ok)throw Error(data.error);
 return data;
}
function fail(error){$('manager-error').textContent=error.message;$('manager-error').focus()}
async function change(action,fields={}){
 if(busy)return;
 busy=true;$('manager-error').textContent='';
 $('manager-status').textContent=action==='advance'?`다음 ${current.next}경기 진행 중`:'저장 중';
 const source=document.activeElement;
 const controls=[...document.querySelectorAll('button:enabled,select:enabled,input:enabled')];
 controls.forEach(el=>el.disabled=true);
 try{
  current=await api(root,{action,...fields,id:current?.id,revision:current?.revision});
  history.replaceState(null,'','/manager?season='+current.id);
  remember(current.id);
  selectedCandidate=0;
  if(action==='advance')activeTab='overview';
  render();
  if(action==='lineup'&&source?.dataset.order){
   const index=Number(source.dataset.index)+Number(source.dataset.delta);
   $('season').querySelector(`[data-order="${source.dataset.order}"][data-index="${index}"]:enabled`)?.focus();
  }else if(action==='focus'){
   $('season').querySelector(`[data-focus="${fields.player}"]`)?.focus();
  }else $('season-title')?.focus();
 }catch(error){fail(error)}finally{
  busy=false;controls.forEach(el=>el.disabled=false);$('manager-status').textContent='';
 }
}
function grade(letter){return `<span class="grade grade-${esc(letter.toLowerCase())}">${esc(letter)}</span>`}
function grades(card){return `<span class="grade-list">${card.abilities.map(a=>`<span class="grade-trait">${esc(a.name)} ${grade(a.grade)}</span>`).join('')}</span>`}
function focusOptions(card){
 return '<option value="">기본</option>'+card.training.map(t=>{
  const change=t.before===t.after?`${t.before} 등급 내 향상`:`${t.before} → ${t.after}`;
  return `<option value="${esc(t.id)}" ${card.focus===t.id?'selected':''}>${esc(t.name)} · ${change}</option>`;
 }).join('');
}
function table(headers,rows){
 return `<div class="manager-table" tabindex="0" role="region" aria-label="${esc(headers[0])} 표"><table><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function row(cells,highlight=false){return `<tr${highlight?' class="mine"':''}>${cells.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`}
function candidateGroup(slot,cards,transfer){
 const marked=current.roster[slot]?.focus;
 const hasSpace=current.focus_used-(marked?1:0)<current.focus_limit;
 return `<div class="player-grid">${cards.map((card,i)=>`
  <button class="player-card" type="button" data-candidate="${i}" aria-pressed="${i===selectedCandidate}">
   <span class="player-role">${esc(slot)}</span><strong class="player-name">${esc(card.name)}</strong>${grades(card)}
  </button>`).join('')}</div><div id="pick-desk" class="pick-desk">${pickDesk(cards,transfer,hasSpace)}</div>`;
}
function pickDesk(cards,transfer,hasSpace){
 const player=cards[selectedCandidate];
 return `<label>집중 훈련<select id="pick-focus" ${hasSpace?'':'disabled'}>${focusOptions(player)}</select></label>
  <button type="button" data-pick="${esc(player.id)}" data-transfer="${transfer}">${esc(player.name)} ${transfer?'영입':'선발'}</button>`;
}
function field(state){
 const positions=['중견수','좌익수','우익수','유격수','2루수','3루수','1루수','포수','지명타자'];
 return `<div class="field-board" aria-label="수비 위치와 지명타자">${positions.map(slot=>{
  const player=state.roster[slot];
  return `<span class="field-card ${state.draft===slot?'current':''}" data-pos="${slot}">${slot}<b>${esc(player?.name||'—')}</b></span>`;
 }).join('')}</div><ul class="arm-board" aria-label="투수 명단">${state.slots.slice(9).map(slot=>
   `<li>${esc(slot)}<b>${esc(state.roster[slot]?.name||'—')}</b></li>`).join('')}</ul>`;
}
function lineup(key,slots){
 return `<ol class="order-list">${slots.map((slot,i)=>{
  const player=current.roster[slot];
  const buttons=[[-1,'위로','↑',i===0],[1,'아래로','↓',i===slots.length-1]].map(([delta,label,icon,disabled])=>
   `<button type="button" class="secondary" data-order="${key}" data-index="${i}" data-delta="${delta}" aria-label="${esc(player.name)} ${label}" ${disabled?'disabled':''}>${icon}</button>`).join('');
  return `<li class="order-item"><span><small>${i+1} · ${esc(slot)}</small><strong>${esc(player.name)}</strong></span><span class="order-buttons">${buttons}</span></li>`;
 }).join('')}</ol>`;
}
function records(){
 return table(['경기','상대','홈·원정','득점','실점'],current.results.slice().reverse().map(g=>row([g.day,g.opponent,g.home?'홈':'원정',g.scored,g.allowed])));
}
function playerRecords(){
 return ['batter','pitcher'].map(role=>table(role==='batter'?['타자','타석','안타','홈런','볼넷','삼진']:['투수','상대 타자','피안타','피홈런','볼넷 허용','탈삼진'],
  Object.entries(current.roster).filter(([,p])=>p.role===role).map(([s,p])=>row([`${p.name} · ${s}`,p.stats.n,p.stats.hits,p.stats.hr,p.stats.bb,p.stats.so])))).join('');
}
function banner(state){
 return `<div class="club-banner"><div><p>${state.year} 시즌 · ${esc(state.replaced)} 자리</p><h1 id="season-title" tabindex="-1">${esc(state.name)}</h1></div>
  <strong>${state.draft?`${Object.keys(state.roster).length} / ${state.slots.length}명`:`${state.day} / ${state.games}경기`}</strong></div>`;
}
function renderDraft(state){
 return `${banner(state)}<div class="draft-layout">
   <div class="game-panel"><div class="panel-title"><h2>${esc(state.draft)} 영입</h2><small>남은 집중 훈련 ${state.focus_limit-state.focus_used}명</small></div>
   <div id="draft-cards">${candidateGroup(state.draft,state.choices,false)}</div></div>
   <aside class="game-panel"><div class="panel-title"><h2>편성 현황</h2></div>${field(state)}</aside></div>`;
}
function standings(state){
 return table(['순위','구단','경기','승','패','무','승률','득실'],state.standings.map(r=>
  row([r.games?r.rank:'—',r.name,r.games,r.w,r.l,r.d,r.w+r.l?r.pct.toFixed(3):'—',r.rf-r.ra],r.team===state.team)));
}
function fixturePanel(state){
 const event=state.event;
 const strip=state.results.slice(-5).map(g=>{
  const result=g.scored>g.allowed?'승':g.scored<g.allowed?'패':'무';
  return `<li class="${result==='승'?'won':result==='패'?'lost':''}" title="${esc(g.opponent)} ${g.scored} 대 ${g.allowed}">${result}</li>`;
 }).join('');
 return `<div class="game-panel"><div class="panel-title"><h2>${event?esc(event.title):'개막 준비'}</h2><small>${event?`${event.from}–${event.to}경기`:'정규시즌'}</small></div>
 ${event?`<p class="event-score">${event.w}승 ${event.l}패 ${event.d}무</p><p class="quiet">${event.rf}득점 · ${event.ra}실점 · 팀 평균 ${event.league_runs}득점</p><ul class="result-strip" aria-label="최근 5경기">${strip}</ul>`:''}
 <div class="event-actions">${state.next?`<button type="button" id="advance-season">다음 ${state.next}경기 진행</button><button type="button" class="secondary" data-show-tab="lineup">라인업 확인</button>`:''}</div></div>`;
}
function marketPanel(state){
 const slots=Object.keys(state.market);
 if(!slots.length)return '';
 if(!slots.includes(marketSlot))marketSlot=slots[0];
 return `<div class="game-panel" id="market-details"><div class="panel-title"><h2>선수 교체</h2><small>이번 점검에 1명</small></div>
 <label>교체 자리<select id="market-slot">${slots.map(slot=>`<option ${slot===marketSlot?'selected':''}>${esc(slot)}</option>`).join('')}</select></label>
 <div id="market-cards">${candidateGroup(marketSlot,state.market[marketSlot],true)}</div></div>`;
}
function lineupPanel(state){
 const editable=state.next>0;
 const roster=Object.entries(state.roster).map(([slot,p])=>`<div class="roster-card"><h3>${esc(p.name)} <small class="quiet">${esc(slot)}</small></h3>${grades(p)}
  ${editable?`<select data-focus="${esc(p.id)}" aria-label="${esc(p.name)} 집중 훈련">${focusOptions(p)}</select>`:''}</div>`).join('');
 const slots=editable?`<div class="lineup-layout"><div class="game-panel"><div class="panel-title"><h2>타순</h2></div>${lineup('batting',state.batting)}</div>
 <div class="game-panel"><div class="panel-title"><h2>선발 로테이션</h2></div>${lineup('rotation',state.rotation)}</div></div>`:'';
 return `${slots}${marketPanel(state)}<div class="game-panel"><div class="panel-title"><h2>선수단</h2><small>집중 훈련 ${state.focus_used} / ${state.focus_limit}명</small></div><div class="roster-list">${roster}</div></div>`;
}
function tabPanel(key,html){return `<section id="manager-panel-${key}" class="game-tab" role="tabpanel" aria-labelledby="manager-tab-${key}" ${activeTab!==key?'hidden':''}>${html}</section>`}
function renderSeason(state){
 const mine=state.standings.find(t=>t.team===state.team);
 const tabButtons=tabs.map(([key,label])=>`<button type="button" id="manager-tab-${key}" role="tab" aria-controls="manager-panel-${key}" aria-selected="${activeTab===key}" tabindex="${activeTab===key?0:-1}" data-tab="${key}">${label}</button>`).join('');
 return `${banner(state)}<div class="manager-summary"><div><span>순위</span><strong>${state.day?mine.rank+'위':'—'}</strong></div>
  <div><span>팀 성적</span><strong>${mine.w}승 ${mine.l}패 ${mine.d}무</strong></div><div><span>득실</span><strong>${mine.rf-mine.ra}</strong></div></div>
  <div><div class="manager-tabs" role="tablist" aria-label="구단 운영">${tabButtons}</div>
  ${tabPanel('overview',`<div class="season-layout">${fixturePanel(state)}<div class="game-panel"><div class="panel-title"><h2>리그 순위</h2></div>${standings(state)}</div></div>`)}
  ${tabPanel('lineup',lineupPanel(state))}
  ${tabPanel('stats',`<div class="record-layout">${state.day?playerRecords():'<p class="quiet">아직 선수 기록이 없습니다.</p>'}</div>`)}
  ${tabPanel('games',`<div class="game-panel">${state.day?records():'<p class="quiet">아직 경기 기록이 없습니다.</p>'}</div>`)}</div>
  <a class="new-season-link" href="/manager">시즌 시작 화면</a>`;
}
function render(){
 $('club-setup').hidden=true;$('season').hidden=false;
 $('season').innerHTML=current.draft?renderDraft(current):renderSeason(current);
}
function setTab(key){
 activeTab=key;
 for(const [name] of tabs){
  const button=$('manager-tab-'+name),selected=name===key;
  button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;
  $('manager-panel-'+name).hidden=!selected;
 }
 $('manager-tab-'+key).focus();
}
$('club-form').onsubmit=event=>{
 event.preventDefault();
 const team=new FormData(event.target).get('team');
 change('create',{team,name:$('club-name').value});
};
$('season').onclick=event=>{
 const button=event.target.closest('button');if(!button||busy)return;
 const data=button.dataset;
 if(data.tab||data.showTab){setTab(data.tab||data.showTab);return}
 if(button.id==='advance-season'){change('advance');return}
 if(data.candidate!==undefined){
  selectedCandidate=Number(data.candidate);
  const inMarket=!!button.closest('#market-cards');
  const slot=inMarket?marketSlot:current.draft;
  const group=button.parentElement;
  for(const candidate of group.children)candidate.setAttribute('aria-pressed',String(candidate===button));
  const hasSpace=current.focus_used-(current.roster[slot]?.focus?1:0)<current.focus_limit;
  $('pick-desk').innerHTML=pickDesk(inMarket?current.market[slot]:current.choices,inMarket,hasSpace);
  return;
 }
 if(data.pick){
  change(data.transfer==='true'?'transfer':'draft',{slot:marketSlot,player:data.pick,focus:$('pick-focus').value});return;
 }
 if(data.order){
  const key=data.order,index=Number(data.index),other=index+Number(data.delta),order=[...current[key]];
  [order[index],order[other]]=[order[other],order[index]];
  change('lineup',{batting:current.batting,rotation:current.rotation,[key]:order});
 }
};
$('season').onkeydown=event=>{
 const key=event.target.dataset.tab;
 if(!key||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
 event.preventDefault();
 const i=tabs.findIndex(([name])=>name===key),n=tabs.length;
 const next=event.key==='Home'?0:event.key==='End'?n-1:(i+(event.key==='ArrowLeft'?-1:1)+n)%n;
 setTab(tabs[next][0]);
};
$('season').onchange=event=>{
 const select=event.target;
 if(select.id==='market-slot'){
  marketSlot=select.value;selectedCandidate=0;
  $('market-cards').innerHTML=candidateGroup(marketSlot,current.market[marketSlot],true);
 }else if(select.dataset.focus){
  const player=Object.values(current.roster).find(p=>p.id===select.dataset.focus);
  change('focus',{player:player.id,focus:select.value}).then(()=>{if($('manager-error').textContent)select.value=player.focus});
 }
};
function remember(id){try{localStorage.setItem('baseball-manager-season',id)}catch{}}
function lastSession(){try{const id=localStorage.getItem('baseball-manager-season');return /^[0-9a-f]{24}$/.test(id)?id:null}catch{return null}}
async function init(){
 try{
  if(query.has('season')){current=await api(root+'?id='+encodeURIComponent(query.get('season')));remember(current.id);render();return}
  const info=await api(root);
  $('replace-team').innerHTML=Object.entries(info.teams).map(([id,name],i)=>`<label><input type="radio" name="team" value="${esc(id)}" ${i===0?'checked':''} required><span>${esc(name)}</span></label>`).join('');
  $('format').textContent=`${info.year} · 10팀 정규시즌 · ${info.games}경기`;
  $('club-setup').hidden=false;
  const saved=lastSession();if(saved){$('resume-save').href='/manager?season='+saved;$('resume-box').hidden=false}
 }catch(error){fail(error);$('manager-status').innerHTML='<a href="/manager">시즌 시작 화면으로</a>'}
}
init();
</script>
</body>
</html>
