<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light;--ink:#163c35;--muted:#546b65;--line:#d8e4dc;--green:#126b50;--paper:#f5f7f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,'Malgun Gothic',sans-serif}main{max-width:1160px;margin:auto;padding:36px 24px 80px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:800}.tag{font-size:12px;background:#e2ede3;padding:5px 12px;border-radius:20px}.hero{padding:38px 0 18px}h1{font-size:clamp(30px,5vw,48px);line-height:1.25;letter-spacing:-1px;margin:12px 0}h2{font-size:23px;margin:0 0 10px}h3{font-size:17px;margin:8px 0}.muted,small{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin:18px 0}.steps .card{margin:0}.num{background:var(--green);color:#fff;border-radius:50%;display:inline-grid;place-items:center;width:28px;height:28px;font-size:14px;margin-bottom:10px}.row{display:flex;gap:18px;align-items:start;flex-wrap:wrap}.row>*{flex:1;min-width:230px}label{display:block;font-size:14px;font-weight:600;margin:12px 0}input,textarea,select{display:block;width:100%;padding:11px;border:1px solid #adc4b6;border-radius:7px;font:inherit;color:inherit;background:#fbfcf8}input[type=checkbox]{width:auto;display:inline;margin-right:6px}textarea{min-height:64px}button,.button{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:7px;padding:12px 19px;font:600 15px system-ui;text-decoration:none;cursor:pointer;margin:8px 8px 4px 0}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e6eee6;color:var(--ink)}.notice{border-left:4px solid #c68b24;padding:14px 18px;background:#fff3d9;border-radius:5px;margin:18px 0}.ok{background:#e5f3e9;border-color:#126b50}.hidden{display:none}details{margin:16px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142d28;color:#d4e5da;padding:18px;border-radius:8px;max-height:260px;overflow:auto;font:13px/1.6 monospace}a{color:var(--green)}.run{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}.badge{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 8px}.progress{height:5px;background:#dfe9df;border-radius:5px;overflow:hidden}.progress.running:after{content:'';display:block;width:30%;height:100%;background:var(--green);animation:move 2s infinite}@keyframes move{from{margin-left:-30%}to{margin-left:100%}}@media(max-width:700px){.steps{grid-template-columns:1fr}header{align-items:start;gap:12px}main{padding:22px 16px}}
</style><main><header><a class="brand" href="/">BaseballLab</a><nav><a href="/simulation">야구 상황 관찰</a> · <a href="/match">Match 연구실</a> · <a href="/lab/data">자료 안내</a></nav></header><div class="hero"><small>BaseballLab · 학습 없이 관찰</small><h1>야구 상황을 직접 보기</h1><p>상황과 정책을 골라 한 턴씩 진행하세요. AI 학습과 별개로 실행됩니다.</p></div><section><div class="row"><label>보고 싶은 기록<select id="source"><option value="model">모델이 생성한 한 점 득점 상황</option><option value="observed">실제 원천의 관측 턴 하나</option></select></label><label>플레이 정책<select id="style"><option value="basic">고정 기본 정책 · 일반 타석 / 정상 승부</option><option value="random">고정 무작위 정책 · 지원 행동 중 선택</option></select></label></div><div class="row"><label>시작 아웃<select id="outs"><option value="0">0아웃</option><option value="1">1아웃</option><option value="2">2아웃</option></select></label><label>시작 주자<select id="bases"><option value="0">주자 없음</option><option value="1" selected>1루</option><option value="2">2루</option><option value="3">1·2루</option><option value="4">3루</option><option value="5">1·3루</option><option value="6">2·3루</option><option value="7">만루</option></select></label></div><details><summary>재현 번호 설정</summary><input id="seed" type="number" min="0" max="2147483647" value="41" aria-label="재현 번호"></details><button id="start">관찰 시작</button><p id="message" role="status">공식 2024년 기록을 준비해 사용합니다.</p><a id="result" class="button hidden" target="_blank" rel="noopener">플레이 보기</a></section><p class="muted">현재 범위: 한 점 득점 상황. 전체 9이닝·투구 추적은 미지원입니다. 모델은 실제 턴 전이를 재추출하며, 실제 기록 보기는 AI가 선택한 플레이가 아닙니다.</p></main><script>const token='__SESSION_TOKEN__',$=id=>document.getElementById(id);let active=null;async function update(){try{let s=await(await fetch('/api/state')).json();if(!active||s.job?.id!==active)return;let j=s.job;$('message').textContent=j.message;$('start').disabled=['queued','running','cancelling'].includes(j.status);if(j.report){$('result').href=j.report;$('result').classList.remove('hidden')}}catch(e){$('message').textContent='연구실 연결을 확인하세요.'}}$('source').onchange=()=>{$('style').disabled=$('source').value==='observed'};$('start').onclick=async()=>{try{$('result').classList.add('hidden');$('start').disabled=true;let r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Token':token},body:JSON.stringify({kind:'simulate',options:{start:'2024-03-20',end:'2024-09-30',seed:Number($('seed').value),outs:Number($('outs').value),bases:Number($('bases').value),observation_source:$('source').value,policy_style:$('style').value}})}),s=await r.json();if(!r.ok)throw Error(s.error);active=s.id;await update()}catch(e){$('message').textContent=e.message;$('start').disabled=false}};setInterval(update,1200);</script></html>
