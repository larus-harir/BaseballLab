<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리그·시대 공통 비교 · EraMatch</title><style>__STYLE__</style>
<main><header><a class="brand" href="/">BaseballLab</a><nav><a href="/eramatch">선수 가상 대결</a><a href="/match">AI 전략 연구</a></nav></header>
<div class="hero"><span class="eyebrow">ERAMATCH</span><h1>리그·시대 공통 비교</h1><p>각 리그 평균보다 얼마나 달랐는지, 같은 기준 환경에 옮겨 비교합니다.</p></div>
<section id="setup"><h2>누구를 비교할까요?</h2><p>리그마다 빠진 기록이 달라 삼진·볼넷·안타·나머지의 네 결과만 사용합니다. 안타 종류와 사구를 지어내지 않습니다.</p><p id="usageNotice" class="notice"></p>
<div class="row"><div><h3>타자</h3><label>리그·시즌<select id="bSource"></select></label><label>이름 또는 원천 ID 검색<input id="bQuery" type="search" maxlength="80"></label><label>타자<select id="bPlayer"></select></label></div><div><h3>투수</h3><label>리그·시즌<select id="pSource"></select></label><label>이름 또는 원천 ID 검색<input id="pQuery" type="search" maxlength="80"></label><label>투수<select id="pPlayer"></select></label></div></div>
<label>경기를 가정할 기준 환경<select id="reference"></select><small>선수 기록의 리그·시즌 평균 대비 비율을 이 환경으로 옮깁니다.</small></label>
<label>타석 수<input id="n" type="number" value="100" min="1" max="10000"></label><button id="run" disabled>공통 기록으로 대결</button>
<details><summary>보정·재현 설정</summary><label>리그 평균을 섞을 타석 수<input id="strength" type="number" min="0" max="2000" value="100"></label><p>100은 탐색용 고정값입니다. 리그 간 예측 성능으로 선택한 값이 아닙니다.</p><label>재현 번호 (비우면 매번 새 추첨)<input id="seed" type="number" min="0" max="2147483647"></label></details>
<p id="message" role="status" aria-live="polite">자료를 확인하고 있어요.</p></section>
<section id="result" class="hidden"><h2 id="resultTitle"></h2><p id="headline"></p><div id="numbers" class="tablewrap"></div><p id="scope" class="notice"></p>
<details><summary>어떤 기준으로 계산했나요?</summary><div id="calculation"></div></details><details><summary>이번 타석 순서</summary><p id="sequence"></p></details><div id="saved"></div></section></main>
<script id="initial" type="application/json">__ANALYSIS__</script><script>
const token='__SESSION_TOKEN__',$=id=>document.getElementById(id),labels={strikeout:'삼진',walk:'볼넷',hit:'안타 (종류 통합)',other:'나머지 (사구 포함)'},keys=Object.keys(labels),initial=JSON.parse($('initial').textContent);let references={},versions={b:0,p:0},loading={b:false,p:false},running=false;
const pct=x=>(x*100).toFixed(1)+'%',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Lab-Token':token}:{},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function table(head,rows){return '<table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function update(){$('run').disabled=running||loading.b||loading.p||!$('bPlayer').value||!$('pPlayer').value}
async function search(side){const version=++versions[side];loading[side]=true;$(side+'Player').disabled=true;update();try{const [league,season]=$(side+'Source').value.split(':'),d=await api('/api/shared/catalog?'+new URLSearchParams({league,season,role:side==='b'?'batter':'pitcher',query:$(side+'Query').value}));if(version!==versions[side])return;$(side+'Player').innerHTML=d.profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' · '+esc(p.team||p.source_fields?.teams?.join('/')||'')+' · '+Object.values(p.events).reduce((a,b)=>a+b,0)+'타석</option>').join('');$('message').textContent=d.matched>80?'타석이 많은 80개 기록을 표시합니다. 검색하면 나머지도 찾을 수 있습니다.':'선수와 기준 환경을 확인하고 실행하세요.'}catch(e){if(version===versions[side]){$('message').textContent=e.message;$(side+'Player').replaceChildren()}}finally{if(version===versions[side]){loading[side]=false;$(side+'Player').disabled=false;update()}}}
function show(r,report){$('result').classList.remove('hidden');$('resultTitle').textContent=r.batter.name+' ('+r.batter.league+' '+r.batter.season+') × '+r.pitcher.name+' ('+r.pitcher.league+' '+r.pitcher.season+')';$('headline').textContent=r.model.steps.target.replace(':',' ')+' 환경으로 비교 · '+r.simulation.n+'타석';$('numbers').innerHTML=table(['결과','예상 확률','예상 개수','이번 개수'],keys.map(k=>[labels[k],pct(r.model.probabilities[k]),r.simulation.expected[k].toFixed(1),r.simulation.counts[k]]));$('scope').textContent=r.scope+' '+r.simulation.uncertainty+((r.batter.league==='NPB'||r.pitcher.league==='NPB'||r.model.steps.target.startsWith('NPB:'))?' 이 기존 결과는 NPB 이용 고지를 확인하기 전 실행됐습니다. 현재는 같은 자료로 새 시뮬레이션·학습을 차단합니다.':'');const s=r.model.steps;$('calculation').innerHTML='<p>먼저 선수 기록에 해당 리그 평균을 '+s.strength+'타석만큼 섞습니다. 그 비율을 원래 리그 평균으로 나누고 기준 환경의 평균을 곱해 합계를 맞춥니다. 두 선수의 보정 비율을 기준 환경으로 나누어 결합합니다.</p>'+table(['결과','타자 원기록','타자 기준 리그','투수 원기록','투수 기준 리그','선택 환경'],keys.map(k=>[labels[k],pct(s.batter_raw[k]),pct(s.origins.batter.rates[k]),pct(s.pitcher_raw[k]),pct(s.origins.pitcher.rates[k]),pct(s.reference[k])]))+'<p>타자 '+s.batter_n+'타석 / 투수 '+s.pitcher_n+'명 상대 · 원천 상태: '+esc(r.batter.provenance_status)+' / '+esc(r.pitcher.provenance_status)+'.</p><p>기준 자료: '+esc(r.data_policy.baseline.basis)+' · '+r.data_policy.baseline.sample_n+'타석. 표본이 적은 기록과 팀별 분할 기록을 구분해 해석하세요.</p>'+r.model.assumptions.map(x=>'<p>'+esc(x)+'</p>').join('')+'<p>자료 ID '+esc(r.dataset_id)+' · 재현 번호 '+r.simulation.seed+'</p>';$('sequence').textContent=r.simulation.events.map((k,i)=>(i+1)+'. '+labels[k]).join(' / ');$('saved').innerHTML=report?'<a href="'+esc(report)+'">저장 결과 다시 열기</a>':''}
$('run').onclick=async()=>{running=true;update();$('message').textContent='대결을 계산하고 저장합니다.';try{const options={data_mode:'common',batter:$('bPlayer').value,pitcher:$('pPlayer').value,reference:$('reference').value,n:Number($('n').value),strength:Number($('strength').value),repetitions:100};if($('seed').value!=='')options.seed=Number($('seed').value);const d=await api('/api/matchup/analyze',{project:'eramatch',options});show(d.analysis,d.report);$('message').textContent='완료했습니다. 결과와 보정 근거를 확인하세요.'}catch(e){$('message').textContent=e.message}finally{running=false;update()}};
async function init(){if(initial){$('setup').classList.add('hidden');show(initial);return}try{const d=await api('/api/shared/catalog');references=d.references;$('usageNotice').textContent=d.usage_notice;const choices=Object.keys(references).filter(k=>!d.blocked_references.includes(k)).sort((a,b)=>Number(b.split(':')[1])-Number(a.split(':')[1])||a.localeCompare(b)),html=choices.map(k=>'<option value="'+esc(k)+'">'+esc(k.replace(':',' '))+'</option>').join('');$('reference').innerHTML=html;for(const side of ['b','p'])$(side+'Source').innerHTML=choices.filter(k=>d.player_sources[side==='b'?'batter':'pitcher'].includes(k)).map(k=>'<option value="'+esc(k)+'">'+esc(k.replace(':',' '))+'</option>').join('');for(const side of ['b','p']){$(side+'Source').onchange=()=>search(side);let timer;$(side+'Query').oninput=()=>{versions[side]++;loading[side]=true;update();clearTimeout(timer);timer=setTimeout(()=>search(side),250)}}await Promise.all([search('b'),search('p')])}catch(e){$('message').textContent=e.message}}init();
</script></html>
