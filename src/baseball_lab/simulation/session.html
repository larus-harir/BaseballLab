<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야구 장면 관람</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f0;color:#193e34;font:16px/1.65 system-ui,'Malgun Gothic',sans-serif}main{max-width:1160px;margin:auto;padding:25px 22px}a{color:#176e50}h1{font-size:32px;margin:10px 0}h2{font-size:23px}small,.muted{color:#60756b}.origin{background:#e0ecdc;padding:12px 18px;border-radius:9px}.stadium{display:grid;grid-template-columns:1.35fr 1fr;margin:22px 0;background:white;border:1px solid #d6e2d6;border-radius:15px;overflow:hidden}.field{background:#edf3e6;padding:22px}.field svg{width:100%;max-height:440px}.score{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:650}.scene{padding:28px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #adc7b3;padding:9px 15px;background:white;border-radius:7px;color:inherit;cursor:pointer}button[aria-current=true],button.primary{background:#176e50;color:white}button:disabled{opacity:.45;cursor:default}.timeline{display:flex;gap:8px;overflow:auto;padding:20px 0}.timeline button{white-space:nowrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin-top:20px}button:focus-visible,select:focus-visible{outline:3px solid #b46726}@media(max-width:700px){main{padding:18px 12px}.stadium{grid-template-columns:1fr}.field{padding:14px}.scene{padding:20px}h1{font-size:26px}}
</style><main><a href="/simulation">← 다른 장면 살펴보기</a><p class="muted">BaseballLab · 야구 장면 관람</p><h1 id="title"></h1><p id="origin" class="origin"></p><div class="stadium"><div class="field"><div class="score"><span id="outs"></span><span id="runs"></span></div><div id="diamond"></div><div class="controls"><button id="previous">← 이전</button><button id="play" class="primary">재생</button><button id="next">다음 →</button><label>속도 <select id="speed"><option value="1600">느리게</option><option value="1000" selected>보통</option><option value="500">빠르게</option></select></label></div></div><div class="scene" aria-live="polite" aria-atomic="true"><small id="step"></small><h2 id="state"></h2><p id="change"></p><h2 id="result"></h2><p id="action"></p><p id="policy" class="muted"></p><p id="inning" class="muted"></p></div></div><div class="timeline" id="timeline" aria-label="장면 목록"></div><p class="muted">주자·아웃은 기록된 상태를 그렸습니다. 이동 경로·공 궤적·구속을 추정한 애니메이션은 아닙니다.</p><details><summary>이 장면에 활용된 실제 경기 기록 보기</summary><pre id="detail"></pre></details><details><summary>현재 이 화면이 보여주는 범위</summary><p>가상 장면은 3아웃 전에 한 점을 내는 제한된 상황이고, 실제 장면은 저장된 관측 턴입니다. 가상 공격의 선택은 과거 관측된 플레이 묶음을 구분한 것이며 개별 스윙 버튼이 아닙니다. 9이닝 승부나 개별 타격 동작을 재현하지 않습니다. 이 관람에서는 새 AI를 학습하지 않습니다.</p></details><small id="credit"></small></main><script>__FIELD_SCRIPT__</script><script>
const d=__SESSION__,$=id=>document.getElementById(id),actual=d.source_status==='REAL_OBSERVED';let i=0,timer=null;
const names={ordinary_turn:'번트 선택 없이 진행',bunt_attempt:'번트 시도 기록을 선택',challenge:'고의볼넷 없이 승부',intentional_walk:'고의볼넷'};
function pause(){clearInterval(timer);timer=null;$('play').textContent='재생'}function show(){let event=d.events[Math.max(0,i-1)],state=i?event.after:event.before,previous=i?event.before:null;BaseballScene.draw($('diamond'),state,previous);BaseballScene.outs($('outs'),state.outs);$('title').textContent=actual?'실제 경기에서 일어났던 장면':'실제 기록을 바탕으로 만든 가상 공격 상황';$('origin').textContent=actual?'실제 경기 기록 · AI가 선택한 플레이가 아닙니다.':'기록 기반 가상 장면 · 비슷한 실제 플레이를 활용했으며 원래 경기를 그대로 재생한 것은 아닙니다.';let runs=d.events.slice(0,i).reduce((a,e)=>a+e.runs,0);$('runs').textContent='이 장면에서 '+runs+'득점';$('state').textContent=BaseballScene.describe(state);$('step').textContent=i?'플레이 '+i+' / '+d.events.length:'시작 장면';$('change').textContent=i?BaseballScene.describe(event.before)+' → '+BaseballScene.describe(event.after):'다음 버튼을 누르면 주자·아웃이 어떻게 바뀌었는지 볼 수 있어요.';$('result').textContent=!i?'공격 상황 시작':event.runs?event.runs+'점이 났어요':state.outs===3?'3아웃, 공격 종료':i===d.events.length?'이 기록의 관찰이 끝났어요':'다음 플레이로 이어집니다';$('action').textContent=i&&event.batter_action?'공격: '+names[event.batter_action]+' / 수비: '+names[event.pitcher_action]:actual?'실제 관측된 플레이를 표시합니다.':'아직 이번 선택을 진행하지 않았습니다.';$('policy').textContent=d.style==='random'?'공격·수비 모두 학습하지 않는 무작위 선택으로 진행합니다.':actual?'사람이 실제 경기에서 만든 기록입니다.':'공격은 번트 선택 없이 진행하고, 수비는 고의볼넷 없이 승부합니다.';$('inning').textContent=event.inning?`${event.inning}회 ${event.bottom?'말':'초'} · 실제 기록에 있는 정보`:'이닝·전체 경기 점수는 이 상황 실험에 포함되지 않습니다.';$('detail').textContent=JSON.stringify(event,null,2);$('previous').disabled=i===0;$('next').disabled=i===d.events.length;$('timeline').querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-current',String(n===i)));$('credit').textContent=d.credit}
function play(){if(timer){pause();return}if(i===d.events.length)i=0;show();$('play').textContent='일시정지';timer=setInterval(()=>{i++;show();if(i>=d.events.length)pause()},Number($('speed').value))}for(let n=0;n<=d.events.length;n++){let b=document.createElement('button');b.textContent=n?'플레이 '+n+' · '+BaseballScene.describe(d.events[n-1].after):'시작';b.onclick=()=>{pause();i=n;show()};$('timeline').append(b)}$('previous').onclick=()=>{pause();i--;show()};$('next').onclick=()=>{pause();i++;show()};$('play').onclick=play;$('speed').onchange=()=>{if(timer){pause();play()}};show();
</script></html>
