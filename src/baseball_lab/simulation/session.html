<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야구 상황 관찰</title><style>body{font:17px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f4f6f2;color:#173d35;margin:0}main{max-width:850px;margin:auto;padding:32px 20px}section{background:white;border:1px solid #dce5df;border-radius:15px;padding:26px;margin:20px 0}button{font:inherit;border:1px solid #bfd0c4;background:white;padding:10px 18px;border-radius:7px;cursor:pointer}button:disabled{opacity:.4}a{color:#197557}.bases{display:flex;justify-content:center;gap:24px;padding:40px}.base{display:grid;place-items:center;transform:rotate(45deg);width:56px;height:56px;border:2px solid #7d9a89}.base:nth-child(2){margin-top:-30px}.base span{transform:rotate(-45deg)}.occupied{background:#197557;color:white}pre{font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}details{margin-top:20px}small{color:#61726d}</style><main><a href="/simulation">← 다른 상황 관찰</a><p>BaseballLab · 학습 없이 시뮬레이션 관찰</p><h1 id="title"></h1><p id="policy"></p><section><small id="step"></small><div class="bases" id="bases"></div><h2 id="state"></h2><p id="action"></p><h2 id="result"></h2><button id="previous">이전</button><button id="play">자동 재생</button><button id="next">다음</button><details><summary>원천 기록 확인</summary><pre id="detail"></pre></details></section><p>현재 지원 범위는 한 점 득점 상황입니다. 9이닝 경기나 투구 궤적을 재현하지 않습니다. 이 관찰에서는 AI를 학습하지 않습니다.</p><small id="credit"></small></main><script>const d=__SESSION__,$=id=>document.getElementById(id);let i=0,timer=null;const names={ordinary_turn:'일반 타석',bunt_attempt:'번트 시도',challenge:'정상 승부',intentional_walk:'고의볼넷'};function show(){let e=d.events[i];$('title').textContent=d.label;$('policy').textContent=d.policies;$('step').textContent=`${i+1} / ${d.events.length}턴`;$('bases').replaceChildren();[3,2,1].forEach(b=>{let v=document.createElement('div');v.className='base'+(e.before.bases&(1<<(b-1))?' occupied':'');let s=document.createElement('span');s.textContent=b+'루';v.append(s);$('bases').append(v)});$('state').textContent=`선택 전 ${e.before.outs}아웃 → 이후 ${e.after.outs}아웃`;$('action').textContent=e.batter_action?`공격 ${names[e.batter_action]} / 수비 ${names[e.pitcher_action]}`:'실제 관측 턴을 그대로 표시합니다.';$('result').textContent=e.runs?`${e.runs}득점`:e.after.outs===3?'무득점 종료':'득점 없이 플레이 진행';$('detail').textContent=JSON.stringify(e,null,2);$('previous').disabled=i===0;$('next').disabled=i===d.events.length-1;$('credit').textContent=d.credit}function pause(){clearInterval(timer);timer=null;$('play').textContent='자동 재생'}$('previous').onclick=()=>{pause();i--;show()};$('next').onclick=()=>{pause();i++;show()};$('play').onclick=()=>{if(timer){pause();return}if(i===d.events.length-1)i=0;show();$('play').textContent='일시정지';timer=setInterval(()=>{if(i===d.events.length-1){pause();return}i++;show()},1000)};show();</script></html>
