<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>한눈에 보기 · BaseballLab</title>
  <style>
    main{margin:auto}
    header,.card-heading{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .back,.card-heading a{font-size:13px;white-space:nowrap}
    .lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
    .lead h1{margin:0 0 10px}
    .scope{color:var(--muted);margin:0}
    dl{display:flex;gap:28px;margin:0}
    dt{color:var(--muted);font-size:12px}
    dd{margin:4px 0 0;font-variant-numeric:tabular-nums}
    dd small{font-size:12px;font-weight:400}
    .roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .card-heading h2{margin:0}
    .played{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin:14px 0;color:var(--muted);font-size:13px}
    .played strong{color:var(--ink);font-size:16px}
    .played span{margin-left:auto;font-variant-numeric:tabular-nums}
    .comparisons{list-style:none;margin:14px 0;padding:0;display:grid;gap:12px}
    .bar-label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
    .bar-label span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
    .track{background:var(--soft);margin:3px 0;overflow:hidden}
    .track i{display:block;height:100%}
    footer{display:flex;gap:12px 20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
    .credits{width:100%;font-size:12px}
    @media(max-width:760px){.lead,.roles{grid-template-columns:minmax(0,1fr)}.played span{margin-left:0}}
    __APP_STYLES__
  </style>
</head>
<body class="page-learning-report">
  <a class="skip-link" href="#report-main">본문으로 건너뛰기</a>
  <main id="report-main">__CONTENT__</main>
</body>
</html>
