name: Tests
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/quickstart.py --mode baseline --seeds 1 2 3 --plate-appearances 100
      - run: python scripts/quickstart.py --games 8 --evaluate-every 4 --evaluation-pairs 1 --output outputs/ci-learning
