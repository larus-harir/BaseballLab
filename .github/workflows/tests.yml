name: Tests
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/quickstart.py --list
      - run: python -c "import subprocess,sys; r=subprocess.run([sys.executable,'scripts/quickstart.py','--mode','train','--data-dir','outputs/ci/no-data','--output','outputs/ci/data-required']); sys.exit(0 if r.returncode==2 else 1)"
